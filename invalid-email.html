<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invalid Email - BPES Document Request and Tracking System</title>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-page">

    <!-- Left panel -->
    <div class="login-left">
      <img src="assets/logo.jpg" alt="BPES Logo" class="login-logo">
      <h1 class="login-title">Bahay Pare Elementary School Document Request and Tracking System</h1>
      <p class="login-tagline">Empowering the next generation through quality education and digital innovation.</p>
    </div>

    <!-- Right panel -->
    <div class="role-right">
      <div class="invalid-content">
        <span class="invalid-icon-badge">
          <img src="assets/icons/alert-circle.svg" alt="">
        </span>

        <h2 class="invalid-heading">Invalid Email</h2>
        <p class="invalid-text">The email address you entered is not authorized for School Staff access.</p>

        <a href="user-role.html" class="login-btn">
          Try Again
          <img src="assets/icons/arrow-right-long.svg" alt="" class="login-btn-icon">
        </a>

        <p class="invalid-contact">Need access? Contact your system administrator.</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
